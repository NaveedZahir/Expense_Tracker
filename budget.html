<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script>

/* =====================================================
   API
===================================================== */

const apiUrl = "http://localhost:3000/budget/";


/* =====================================================
   LOGIN CHECK
===================================================== */

function checklogin(){

    const token = localStorage.getItem("token");

    if(!token){

        window.location.href = "login.html";

    }

    return token;

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem("token");

    window.location.href = "login.html";

}


/* =====================================================
   SHOW BUDGETS
===================================================== */

async function showBudget(){

    const token = checklogin();

    /*
        Change /all if your backend uses another route.
    */

    const res = await fetch(`${apiUrl}all`, {

        method: "GET",

        headers: {
            Authorization: `Bearer ${token}`
        }

    });


    if(!res.ok){

        console.log("Unable to load budgets");
        return;

    }


    const data = await res.json();

    console.log(data);


    const table = document.getElementById("budgetTable");

    table.innerHTML = "";


   


    data.data.forEach((budget, index) => {

        const monthName = getMonthName(budget.month);


        table.innerHTML += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    <span class="badge bg-primary">
                        ${monthName}
                    </span>
                </td>

                <td>
                    ${budget.year}
                </td>

                <td>
                    <strong>
                        ${budget.budget_amount}
                    </strong>
                </td>

                

                <td>

                    <button
                        type="button"
                        class="btn btn-warning btn-sm me-2"
                        onclick="editBudget(${budget.id})">

                        <i class="bi bi-pencil-square"></i>
                        Edit

                    </button>


                    <button
                        type="button"
                        class="btn btn-danger btn-sm"
                        onclick="deleteBudget(${budget.id})">

                        <i class="bi bi-trash"></i>
                        Delete

                    </button>

                </td>

            </tr>

        `;

    });

}


/* =====================================================
   MONTH NAME
===================================================== */

function getMonthName(month){

    const months = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];

    return months[Number(month) - 1] ?? "Unknown";

}


/* =====================================================
   ADD BUDGET
===================================================== */

document
.getElementById("budgetForm")
.addEventListener("submit", async function(e){

    e.preventDefault();


    const token = checklogin();


    const month =Number(
        document.getElementById("month").value);

    const year =Number(
        document.getElementById("year").value);

    const budget_amount =
        document.getElementById("amount").value;

   console.log(amount,month,year);

  /// http://localhost:3000/budget/
    const response = await fetch(`${apiUrl}add`, {

        method: "POST",

        headers: {

            "Content-Type": "application/json",

            "Authorization": `Bearer ${token}`

        },

        body: JSON.stringify({

            month,
            year,
            budget_amount,
           

        })

    });


    if(response.ok){

        alert("Budget added successfully");


        document
        .getElementById("budgetForm")
        .reset();


        const modal =
            bootstrap.Modal.getInstance(
                document.getElementById("budgetModal")
            );


        if(modal){
            modal.hide();
        }


        showBudget();

    }
    else{

        console.log(await response.text());

    }

});


/* =====================================================
   EDIT BUDGET
===================================================== */

async function editBudget(id){

    const token = checklogin();


    /*
        Change this URL if your backend
        uses another GET route.
    */

    const res = await fetch(`${apiUrl}${id}`, {

        method: "GET",

        headers: {

            Authorization: `Bearer ${token}`

        }

    });


    if(!res.ok){

        alert("Unable to fetch budget");

        return;

    }


    const budget = await res.json();

    console.log(budget);


    /*
        Fill existing values
    */

    document
    .getElementById("editBudgetId")
    .value = budget.data.id;


    document
    .getElementById("editMonth")
    .value = String(budget.data.month);


    document
    .getElementById("editYear")
    .value = budget.data.year;


    document
    .getElementById("editAmount")
    .value = budget.data.budget_amount;




    /*
        Open modal
    */

    const modal = new bootstrap.Modal(
        document.getElementById("editBudgetModal")
    );


    modal.show();

}


/* =====================================================
   UPDATE BUDGET
===================================================== */

document
.getElementById("editBudgetForm")
.addEventListener("submit", async function(e){

    e.preventDefault();


    const token = checklogin();


    const id =Number(
        document.getElementById("editBudgetId").value);


    const month =Number(document.getElementById("editMonth").value)
        

    const year =Number(
        document.getElementById("editYear").value);


    const budget_amount =Number(
        document.getElementById("editAmount").value);




    /*
        Change the URL if your PUT route
        is different.
    */

    const response = await fetch(`${apiUrl}update/${id}`, {

        method: "PUT",

        headers: {

            "Content-Type": "application/json",

            "Authorization": `Bearer ${token}`

        },

        body: JSON.stringify({

            month,
            year,
            budget_amount,
           

        })

    });


    if(response.ok){

        alert("Budget updated successfully");


        const modal =
            bootstrap.Modal.getInstance(
                document.getElementById("editBudgetModal")
            );


        if(modal){
            modal.hide();
        }


        showBudget();

    }
    else{

        console.log(await response.text());

    }

});


/* =====================================================
   DELETE BUDGET
===================================================== */

async function deleteBudget(id){

    const confirmDelete =
        confirm("Are you sure you want to delete this budget?");


    if(!confirmDelete){
        return;
    }


    const token = checklogin();


   

    const response = await fetch(`${apiUrl}delete/${id}`, {

        method: "DELETE",

        headers: {

            Authorization: `Bearer ${token}`

        }

    });


    if(response.ok){

        alert("Budget deleted successfully");

        showBudget();

    }
    else{

        console.log(await response.text());

    }

}


/* =====================================================
   LOAD BUDGETS
===================================================== */
console.log("Naveed")
showBudget()
</script>
