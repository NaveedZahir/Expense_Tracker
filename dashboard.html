
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker Dashboard</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #f5f7fb;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .dashboard-title {
            font-weight: 700;
        }

        .stat-card {
            border: none;
            border-radius: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .chart-card {
            border: none;
            border-radius: 16px;
        }

        .chart-container {
            position: relative;
            height: 320px;
        }

        .amount {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .navbar-nav .nav-link {
            font-weight: 500;
        }

        .nav-link.active {
            font-weight: 700;
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<style>
  .navbar-blue {
    background-color: #0d47a1 !important;
  }
  .navbar-blue .navbar-brand {
    color: #ffffff !important;
    font-weight: 700;
  }
</style>
<body class="bg-light">

<!-- ===================== NAVBAR ===================== -->

<nav class="navbar navbar-expand-lg navbar-blue">
  <div class="container-fluid">
    <a class="navbar-brand" href="analytics.html">
      <i class="bi bi-wallet2"></i> Expense Tracker
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <div class="d-flex flex-wrap gap-2 ms-lg-auto align-items-center">
        <a href="analytics.html" class="btn btn-light text-primary">
          <i class="bi bi-speedometer2"></i> Analytics
        </a>
        <a href="expense.html" class="btn btn-light text-primary">
          <i class="bi bi-receipt"></i> Expense
        </a>
        <a href="budget.html" class="btn btn-light text-primary">
          <i class="bi bi-piggy-bank"></i> Budget
        </a>
        <a href="category.html" class="btn btn-light text-primary">
          <i class="bi bi-tags"></i> Category
        </a>
        
        <button id="logoutBtn" class="btn btn-outline-light">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- ================= DASHBOARD ================= -->

<div class="container py-5">

    <div class="mb-4">
        <h2 class="dashboard-title">Dashboard</h2>
        <p class="text-muted mb-0">
            Here's an overview of your spending this month.
        </p>
    </div>


    <!-- ================= STAT CARDS ================= -->

    <div class="row g-4 mb-4">

        <!-- Budget -->
        <div class="col-md-6 col-xl-3">

            <div class="card stat-card shadow-sm h-100">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>
                            <p class="text-muted mb-1">
                                Total Budget
                            </p>

                            <div class="amount" id="budgetAmount">
                                Rs0
                            </div>
                        </div>

                        <div class="stat-icon bg-primary-subtle text-primary">
                            <i class="bi bi-wallet2"></i>
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Spent -->
        <div class="col-md-6 col-xl-3">

            <div class="card stat-card shadow-sm h-100">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>
                            <p class="text-muted mb-1">
                                Total Spent
                            </p>

                            <div class="amount" id="spentAmount">
                                $0
                            </div>
                        </div>

                        <div class="stat-icon bg-danger-subtle text-danger">
                            <i class="bi bi-credit-card"></i>
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Remaining -->
        <div class="col-md-6 col-xl-3">

            <div class="card stat-card shadow-sm h-100">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>
                            <p class="text-muted mb-1">
                                Remaining
                            </p>

                            <div class="amount" id="remainingAmount">
                                $0
                            </div>
                        </div>

                        <div class="stat-icon bg-success-subtle text-success">
                            <i class="bi bi-piggy-bank"></i>
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Expense Count -->
        <div class="col-md-6 col-xl-3">

            <div class="card stat-card shadow-sm h-100">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>
                            <p class="text-muted mb-1">
                                Expenses
                            </p>

                            <div class="amount" id="spentCount">
                                0
                            </div>
                        </div>

                        <div class="stat-icon bg-warning-subtle text-warning">
                            <i class="bi bi-receipt"></i>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ================= CHARTS ================= -->

    <div class="row g-4">

        <!-- Budget Overview -->
        <div class="col-lg-5">

            <div class="card chart-card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="fw-bold mb-1">
                        Budget Overview
                    </h5>

                    <p class="text-muted">
                        Your spending compared to your budget
                    </p>

                    <div class="chart-container">
                        <canvas id="budgetChart"></canvas>
                    </div>

                </div>

            </div>

        </div>


        <!-- Spending Summary -->
        <div class="col-lg-7">

            <div class="card chart-card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="fw-bold mb-1">
                        Spending Summary
                    </h5>

                    <p class="text-muted">
                        Current month's financial overview
                    </p>

                    <div class="chart-container">
                        <canvas id="spendingChart"></canvas>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>
const apiUrl = "http://localhost:3000/budget/"
function checklogin(){

    const token = localStorage.getItem("token");

    if(!token){

        window.location.href = "login.html";

    }

    return token;

}

 const token = checklogin();

   


    

  

    let budgetChart;
    let spendingChart;


    async function show() {

        try {

            const res = await fetch(`${apiUrl}dashboard`, {

                method: "GET",

                headers: {
                    Authorization: `Bearer ${token}`
                }

            });


            if (!res.ok) {

                console.log("Unable to load dashboard");
                return;

            }


            const data = await res.json();


            const Budget = Number(data.result.Budget) || 0;
            const Spent = Number(data.result.Spent) || 0;
            const Remaining = Number(data.result.Remaining) || 0;
            const Spent_Count = Number(data.result.Spent_Count) || 0;


            // ==========================
            // UPDATE CARDS
            // ==========================

            document.getElementById("budgetAmount").textContent =
                `RS${Budget.toLocaleString()}`;

            document.getElementById("spentAmount").textContent =
                `RS${Spent.toLocaleString()}`;

            document.getElementById("remainingAmount").textContent =
                `RS${Remaining.toLocaleString()}`;

            document.getElementById("spentCount").textContent =
                Spent_Count;


            // ==========================
            // BUDGET DOUGHNUT CHART
            // ==========================

            const spentForChart = Math.min(Spent, Budget);

            const remainingForChart =
                Math.max(Budget - Spent, 0);


            if (budgetChart) {
                budgetChart.destroy();
            }


            budgetChart = new Chart(
                document.getElementById("budgetChart"),
                {

                    type: "doughnut",

                    data: {

                        labels: [
                            "Spent",
                            "Remaining"
                        ],

                        datasets: [

                            {
                                data: [
                                    spentForChart,
                                    remainingForChart
                                ],

                                borderWidth: 0
                            }

                        ]

                    },

                    options: {

                        responsive: true,

                        maintainAspectRatio: false,

                        cutout: "70%",

                        plugins: {

                            legend: {
                                position: "bottom"
                            }

                        }

                    }

                }
            );


            // ==========================
            // SPENDING BAR CHART
            // ==========================

            if (spendingChart) {
                spendingChart.destroy();
            }


            spendingChart = new Chart(
                document.getElementById("spendingChart"),
                {

                    type: "bar",

                    data: {

                        labels: [
                            "Budget",
                            "Spent",
                            "Remaining"
                        ],

                        datasets: [

                            {
                                label: "Amount",

                                data: [
                                    Budget,
                                    Spent,
                                    Remaining
                                ],

                                borderRadius: 8
                            }

                        ]

                    },

                    options: {

                        responsive: true,

                        maintainAspectRatio: false,

                        plugins: {

                            legend: {
                                display: false
                            }

                        },

                        scales: {

                            y: {

                                beginAtZero: true,

                                ticks: {

                                    callback: function(value) {
                                        return "$" + value;
                                    }

                                }

                            }

                        }

                    }

                }
            );


        } catch (error) {

            console.error("Dashboard error:", error);

        }

    }


    // ==========================
    // LOGOUT
    // ==========================

    function logout() {

        localStorage.removeItem("token");

        sessionStorage.removeItem("token");

        window.location.href = "login.html";

    }


    show();

</script>

</body>
</html>
