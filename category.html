    <!-- Bootstrap Icons -->

</head>
<body class="bg-light">

      <span class="navbar-toggler-icon"></span>

    <div class="collapse navbar-collapse" id="navContent">
      <div class="d-flex flex-wrap gap-2 ms-lg-auto align-items-center">
        <a href="dashboard.html" class="btn btn-light text-primary">

<div class="container py-5">

    <div class="row">

        <!-- Add Category -->
        <div class="col-lg-4 mb-4">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-plus-circle"></i>
                        Add Category
                    </h5>
                </div>

                <div class="card-body">

                    <form id="categoryForm">

                        <div class="mb-3">
                            <label class="form-label">
                                Category Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="categoryName"
                                placeholder="Enter category name"
                                required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-save"></i>
                            Save Category
                        </button>

                    </form>

                </div>

            </div>

        </div>

        <!-- Category List -->
        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-list"></i>
                        My Categories
                    </h5>
                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Category Name</th>
                                    <th width="180">Actions</th>
                                </tr>
                            </thead>
<tbody id="categoryTable">

    <tr>
        <td>1</td>
        <td id="categoryName">Category Name</td>

        <td>
            <button
                type="button"
                class="btn btn-warning btn-sm me-2"
                onclick="editCategory()">
                <i class="bi bi-pencil-square"></i> Edit
            </button>

            <button
                type="button"
                class="btn btn-danger btn-sm"
                onclick="deleteCategory()">
                <i class="bi bi-trash"></i> Delete
            </button>
        </td>
    </tr>

</tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiUrl="http://localhost:3000/category/";
 function checklogin(){
    const token=localStorage.getItem("token")
    if(!token){
      window.location.href="login.html";
    }
    return token ;
  }
async function showCategory(){
const token =checklogin();
const res= await fetch("http://localhost:3000/category/one ", {
    method: "GET",
    headers: {
        "Authorization": `Bearer ${token}`
    }

})
const data = await res.json();

const table = document.getElementById("categoryTable");

// Clear existing rows
table.innerHTML = "";

data.Data.forEach((category, index) => {

    table.innerHTML += `
        <tr>
            <td>${index + 1}</td>

            <td>${category.name}</td>

            <td>
                <button
                    type="button"
                    class="btn btn-warning btn-sm me-2"
                    onclick="editCategory(${category.id})">
                    <i class="bi bi-pencil-square"></i> Edit
                </button>

                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    onclick="deleteCategory(${category.id})">
                    <i class="bi bi-trash"></i> Delete
                </button>
            </td>
        </tr>
    `;
});



}
async function addCategory(){
    const token =checklogin();
    let form =document.getElementById("categoryForm");
    form.addEventListener("submit",async (e)=>{
        e.preventDefault();
    const name=document.getElementById("categoryName").value 
    console.log(name)
     const res=await fetch(`${apiUrl}add`,{
         method: "POST",
    headers: {
         "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
    },
    body:JSON.stringify({name})
    
     })
      if (res.ok){
        showCategory();
        // alert("Category added successfully")
    }
    
    })
   
}
async function deleteCategory(id){
    const token =checklogin();
const res= await fetch(`http://localhost:3000/category/delete/${id}  `, {
    method: "DELETE",
    headers: {
        "Authorization": `Bearer ${token}`
    }

})
showCategory();
}
addCategory();
showCategory();
function logout() {

        localStorage.removeItem("token");

        sessionStorage.removeItem("token");

        window.location.href = "login.html";

    }


</script>
</body>
</html>
