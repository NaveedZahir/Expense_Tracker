<!---Expense Model-->
<div class="modal fade" id="editExpenseModal" tabindex="-1">

            <div class="modal-header bg-warning">

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

function logout(){

    localStorage.removeItem("token");

    window.location.href="login.html";

}

function checklogin(){

    const token = localStorage.getItem("token");

    if(!token){

        window.location.href="login.html";

    }

    return token;

}

// Cached map of { cat_id: cat_name }, filled once and reused everywhere
let categoryMap = {};

async function get_cat_name(){
    const token=checklogin();
    const resp = await fetch("http://localhost:3000/category/one",{

        method:"GET",

        headers:{
            Authorization:`Bearer ${token}`
        }

    });


    let arr=await resp.json();
    arr=arr.Data
    let obj={};
    
    for(x of arr){
         obj[x.id]=x.name;
    }
    categoryMap = obj;
    return obj;
}

// Renders any array of expense rows into the table using the cached category map
function renderRows(data){

    const table = document.getElementById("expenseTable");

    table.innerHTML = "";

    if(!data || data.length === 0){
        table.innerHTML = `
            <tr>
                <td colspan="7" class="text-center text-muted py-4">
                    No expenses found
                </td>
            </tr>
        `;
        return;
    }

    data.forEach((expense,index)=>{

        table.innerHTML += `
            <tr>

                <td>${index + 1}</td>

                <td>${expense.title}</td>

                <td>${expense.amount}</td>

                <td>${new Date(expense.date).toLocaleDateString()}</td>

                <td>${categoryMap[expense.cat_id] ?? ""}</td>

                <td>${expense.Note ?? ""}</td>

                <td>

                    <button
                        class="btn btn-warning btn-sm me-2"
                        onclick="editExpense(${expense.id})">

                        <i class="bi bi-pencil-square"></i>
                        Edit

                    </button>

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="deleteExpense(${expense.id})">

                        <i class="bi bi-trash"></i>
                        Delete

                    </button>

                </td>

            </tr>
        `;

    });

}

async function showExpense(){

    const token = checklogin();

    // make sure the category map is ready before rendering
    if(Object.keys(categoryMap).length === 0){
        await get_cat_name();
    }

    const res = await fetch("http://localhost:3000/expense/all",{

        method:"GET",

        headers:{
            Authorization:`Bearer ${token}`
        }

    });

    if(!res.ok){
        console.log("Unable to load expenses");
        return;
    }

    const data = await res.json();

    renderRows(data);

}

showExpense();

async function addCategory(){

    const token = checklogin();

    const res = await fetch("http://localhost:3000/category/one",{

        method:"GET",

        headers:{
            Authorization:`Bearer ${token}`
        }

    });

    const data = await res.json();

    const select = document.getElementById("category");

    select.innerHTML = `
        <option value="">
            Select Category
        </option>
    `;

    data.Data.forEach(category=>{

        select.innerHTML += `
            <option value="${category.id}">
                ${category.name}
            </option>
        `;

    });

    // also fill the "Filter by Category" dropdown in the toolbar
    const filterSelect = document.getElementById("filterCategory");
    if(filterSelect){
        filterSelect.innerHTML = `<option value="">All Categories</option>`;
        data.Data.forEach(category=>{
            filterSelect.innerHTML += `
                <option value="${category.id}">
                    ${category.name}
                </option>
            `;
        });
    }

    // Sending data 
    let form=document.getElementById("expenseForm");
    form.addEventListener("submit",async(e)=>{
        e.preventDefault();
        const title=document.getElementById("title").value 
        const amount =Number(document.getElementById("amount").value )
        const date =document.getElementById("date").value 
        const Note =document.getElementById("note").value;
        const cat_id =Number(document.getElementById("category").value);
        let response = await fetch("http://localhost:3000/expense/add",
            {
                  method: "POST",
    headers: {
         "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
    },
    body:JSON.stringify({title,amount,date,cat_id,Note})
            }
        )
        
    if(response.ok){
        console.log("Added sucessfully")
         document.getElementById("expenseForm").reset();
         showExpense();
    }
    else{
        console.log(response.error);
    }
    })

}

async function deleteExpense(id){
   const token =checklogin();
    const res= await fetch(`http://localhost:3000/expense/delete/${id}`, {
        method: "DELETE",
        headers: {
            "Authorization": `Bearer ${token}`
        }

    })
    if(res.ok){
        showExpense();
    }
    else{
        console.log("Some error occured")
    }
}

addCategory();

let id_to;
async function editExpense(id) {
    id_to=id;
    const token = checklogin();

    const res = await fetch(`http://localhost:3000/expense/${id}`, {
        method: "GET",
        headers: {
            Authorization: `Bearer ${token}`
        }
    });

    if (!res.ok) {
        alert("Unable to fetch expense.");
        return;
    }

    const expense = await res.json();

    const obj = await get_cat_name();

    document.getElementById("editId").value = expense.id;
    document.getElementById("editTitle").value = expense.title;
    document.getElementById("editAmount").value = expense.amount;
    document.getElementById("editDate").value = expense.date.substring(0, 10);
    document.getElementById("editNote").value = expense.Note ?? "";

    const select = document.getElementById("editCategory");
    select.innerHTML = "";

    for (const id in obj) {

        const option = document.createElement("option");
        option.value = id;
        option.textContent = obj[id];

        select.appendChild(option);
    }

    select.value = String(expense.cat_id);

    const modal = new bootstrap.Modal(
        document.getElementById("editExpenseModal")
    );

    modal.show();
}

document.getElementById("editExpenseForm").addEventListener("submit", async (e) => {

    e.preventDefault();

    const token = checklogin();

    const id = document.getElementById("editId").value;
    const title = document.getElementById("editTitle").value;
    const amount = Number(document.getElementById("editAmount").value);
    const date = document.getElementById("editDate").value;
    const cat_id =Number( document.getElementById("editCategory").value);
    const Note = document.getElementById("editNote").value;

    const response = await fetch(`http://localhost:3000/expense/update/${id_to}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },

        body: JSON.stringify({
            title,
            amount,
            date,
            cat_id,
            Note
        })

    });

    if (response.ok) {

        alert("Expense Updated Successfully");

        bootstrap.Modal.getInstance(
            document.getElementById("editExpenseModal")
        ).hide();

        showExpense();

    } 
});

// ===================== SORT / FILTER / SEARCH =====================

async function sorting(order){
    const tk=checklogin();

    if(Object.keys(categoryMap).length === 0){
        await get_cat_name();
    }

    const res = await fetch(`http://localhost:3000/expense/sort?order=${encodeURIComponent(order)}`,{
        method:"GET",
        headers:{
            Authorization:`Bearer ${tk}`
        }
    });

    if(!res.ok){
        console.log("Unable to sort expenses");
        return;
    }

    const data = await res.json();
    renderRows(data);
}

async function categoryFilter(catId){
    const tk=checklogin();

    if(Object.keys(categoryMap).length === 0){
        await get_cat_name();
    }

    const res = await fetch(`http://localhost:3000/expense/filterCategory?category=${encodeURIComponent(catId)}`,{
        method:"GET",
        headers:{
            Authorization:`Bearer ${tk}`
        }
    });

    if(!res.ok){
        console.log("Unable to filter by category");
        return;
    }

    const data = await res.json();
    renderRows(data);
}

async function Search(title){
    const tk=checklogin();

    if(Object.keys(categoryMap).length === 0){
        await get_cat_name();
    }

    const res = await fetch(`http://localhost:3000/expense/searchTitle?title=${encodeURIComponent(title)}`,{
        method:"GET",
        headers:{
            Authorization:`Bearer ${tk}`
        }
    });

    if(!res.ok){
        console.log("Unable to search expenses");
        return;
    }

    const data = await res.json();
    renderRows(data);
}

async function filterYear(year){
    const tk=checklogin();

    if(Object.keys(categoryMap).length === 0){
        await get_cat_name();
    }

    const res = await fetch(`http://localhost:3000/expense/filterYear/?year=${encodeURIComponent(year)}`,{
        method:"GET",
        headers:{
            Authorization:`Bearer ${tk}`
        }
    });

    if(!res.ok){
        console.log("Unable to filter by year");
        return;
    }

    const data = await res.json();
    renderRows(data);
}

async function filterMonth(month){
    const tk=checklogin();

    if(Object.keys(categoryMap).length === 0){
        await get_cat_name();
    }

    const res = await fetch(`http://localhost:3000/expense/filterMonth/?month=${encodeURIComponent(month)}`,{
        method:"GET",
        headers:{
            Authorization:`Bearer ${tk}`
        }
    });

    if(!res.ok){
        console.log("Unable to filter by month");
        return;
    }

    const data = await res.json();
    renderRows(data);
}

// Small debounce helper so the search box doesn't fire a request on every keystroke
function debounce(fn, delay){
    let timer;
    return function(...args){
        clearTimeout(timer);
        timer = setTimeout(()=> fn.apply(this,args), delay);
    };
}

// Whenever one control is used, clear the others so filters don't visually
// conflict with each other (backend endpoints are independent, not combinable).
function clearOtherControls(exceptId){
    const ids = ["searchTitle","sortOrder","filterCategory","filterMonth","filterYear"];
    ids.forEach(id=>{
        if(id !== exceptId){
            const el = document.getElementById(id);
            if(el) el.value = "";
        }
    });
}

document.getElementById("searchTitle").addEventListener("input", debounce((e)=>{
    const value = e.target.value.trim();
    if(value === ""){
        showExpense();
        return;
    }
    clearOtherControls("searchTitle");
    Search(value);
}, 400));

document.getElementById("sortOrder").addEventListener("change", (e)=>{
    const value = e.target.value;
    if(value === ""){
        showExpense();
        return;
    }
    clearOtherControls("sortOrder");
    sorting(value);
});

document.getElementById("filterCategory").addEventListener("change", (e)=>{
    const value = e.target.value;
    if(value === ""){
        showExpense();
        return;
    }
    clearOtherControls("filterCategory");
    categoryFilter(value);
});

document.getElementById("filterMonth").addEventListener("change", (e)=>{
    const value = e.target.value;
    if(value === ""){
        showExpense();
        return;
    }
    clearOtherControls("filterMonth");
    filterMonth(value);
});

document.getElementById("filterYear").addEventListener("input", debounce((e)=>{
    const value = e.target.value.trim();
    if(value === ""){
        showExpense();
        return;
    }
    clearOtherControls("filterYear");
    filterYear(value);
}, 400));

document.getElementById("resetFilters").addEventListener("click", ()=>{
    clearOtherControls(null);
    showExpense();
});

</script>
